[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign.map"
version = "0.2.0"
description = "Check AI data flows against data residency, control and transfer rules you define: findings with fixes, jurisdiction exposure, egress, diffs for CI, DOT, Mermaid and SARIF output. Not legal advice. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[project.scripts]
sovereign-map = "sovereign_map.cli:main"

[tool.setuptools.package-data]
sovereign_map = ["py.typed"]

[tool.setuptools.packages.find]
include = ["sovereign_map*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["sovereign_map"]
